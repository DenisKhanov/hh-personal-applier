<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HH Personal Applier</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>HH Personal Applier</h1>
          <p>Local run control</p>
        </div>
        <span id="statusBadge" class="status status-idle">Idle</span>
      </header>

      <section class="panel">
        <label class="field">
          <span>Backend URL</span>
          <input
            id="backendUrl"
            name="backendUrl"
            type="url"
            autocomplete="off"
            spellcheck="false"
            value="http://127.0.0.1:8080"
          />
        </label>

        <label class="field">
          <span>X-Local-Secret</span>
          <input
            id="sharedSecret"
            name="sharedSecret"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="32+ characters"
          />
        </label>

        <div class="actions">
          <button id="saveButton" type="button">Save</button>
          <button id="healthButton" type="button" class="primary">
            Check
          </button>
        </div>
        <button id="telegramTestButton" type="button" class="wide">
          Send test message to Telegram
        </button>
      </section>

      <section class="panel run-panel">
        <div class="run-header">
          <div>
            <h2>Run</h2>
            <p id="runStatus">Idle</p>
          </div>
          <span id="runStateBadge" class="run-state run-state-idle">Idle</span>
        </div>

        <div class="actions three">
          <button id="startButton" type="button" class="primary">Start</button>
          <button id="continueButton" type="button">Continue</button>
          <button id="stopButton" type="button" class="danger">Stop</button>
        </div>
      </section>

      <section class="panel stats-panel">
        <div class="section-title">
          <h2>Today</h2>
          <button id="refreshButton" type="button" class="small">Refresh</button>
        </div>
        <dl class="stats-grid">
          <div>
            <dt>Applied</dt>
            <dd id="appliedCount">0</dd>
          </div>
          <div>
            <dt>Skipped</dt>
            <dd id="skippedCount">0</dd>
          </div>
          <div>
            <dt>Errors</dt>
            <dd id="errorCount">0</dd>
          </div>
          <div>
            <dt>Remaining</dt>
            <dd id="remainingCount">0</dd>
          </div>
        </dl>
      </section>

      <section class="panel settings-panel">
        <div class="section-title">
          <h2>Settings</h2>
          <button id="saveOwnerSettingsButton" type="button" class="small">Save</button>
        </div>
        <div class="settings-grid">
          <label class="field compact">
            <span>Daily limit</span>
            <input id="dailyLimit" type="number" min="1" max="200" step="1" />
          </label>
          <label class="field compact">
            <span>Run limit</span>
            <input id="runLimit" type="number" min="1" max="100" step="1" />
          </label>
          <label class="field compact">
            <span>Pace min</span>
            <input id="paceMinSeconds" type="number" min="5" max="60" step="1" />
          </label>
          <label class="field compact">
            <span>Pace max</span>
            <input id="paceMaxSeconds" type="number" min="5" max="180" step="1" />
          </label>
        </div>
        <label class="toggle">
          <input id="skipWithTest" type="checkbox" />
          <span>Skip vacancies with tests</span>
        </label>
        <label class="toggle">
          <input id="skipExternal" type="checkbox" />
          <span>Skip external responses</span>
        </label>
        <label class="toggle">
          <input id="requireCoverLetterApproval" type="checkbox" />
          <span>Require Telegram approval for letters</span>
        </label>
        <label class="toggle">
          <input id="autoApply" type="checkbox" />
          <span>Auto apply without popup confirmation</span>
        </label>
      </section>

      <section class="panel recent-panel">
        <h2>Recent</h2>
        <ol id="recentList" class="recent-list"></ol>
      </section>

      <section id="confirmPanel" class="panel confirm-panel" hidden>
        <h2>Подтверждение отклика</h2>
        <p id="confirmTitle" class="confirm-title"></p>
        <p id="confirmEmployer" class="confirm-employer"></p>
        <a id="confirmLink" class="confirm-link" href="#" target="_blank" rel="noreferrer"></a>
        <div class="actions">
          <button id="confirmButton" type="button" class="primary">Подтвердить</button>
          <button id="skipButton" type="button" class="danger">Пропустить</button>
        </div>
      </section>

      <p id="message" class="message" aria-live="polite">
        Configure the local secret, then check the backend.
      </p>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
